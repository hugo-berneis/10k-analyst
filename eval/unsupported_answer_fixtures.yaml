# Deliberately wrong answers, paired with real context, to test the
# groundedness gate (answer/groundedness.py). Per CLAUDE.md: "build a set
# of deliberately unsupported answers to test the gate."
#
# Categories:
#   fabricated_number    -- a number the source never said. Caught by
#                           plain-code numeric_check, deterministically,
#                           regardless of Jev.
#   hallucinated_citation -- cites a paragraph ID that isn't in context.
#                           Caught by plain-code citation resolution,
#                           deterministically, regardless of Jev.
#   unsupported_claim    -- no bad number or citation, but the claim
#                           contradicts or isn't supported by the cited
#                           text. Only a real semantic groundedness check
#                           can catch this -- MockDecisionClient's verdict
#                           here is not meaningful, only structural.

