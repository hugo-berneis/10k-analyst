services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-report_qa}
      POSTGRES_USER: ${POSTGRES_USER:-report_qa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-report_qa}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-report_qa}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
